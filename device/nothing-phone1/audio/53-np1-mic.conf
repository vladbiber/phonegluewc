# capture is pcm 2 (MultiMedia3 <- TX_CODEC_DMA_TX_3), mixer route set by np1-mic and kept in asound.state
monitor.alsa.rules = [
  {
    matches = [ { node.name = "alsa_input.platform-sound.pro-input-2" } ]
    actions = { update-props = { audio.channels = 1, audio.position = "MONO", node.description = "Microphone", priority.session = 1000 } }
  }
  {
    matches = [
      { node.name = "alsa_input.platform-sound.pro-input-0" }
      { node.name = "alsa_input.platform-sound.pro-input-1" }
      { node.name = "alsa_output.platform-sound.pro-output-1" }
      { node.name = "alsa_output.platform-sound.pro-output-2" }
    ]
    actions = { update-props = { node.disabled = true } }
  }
]
